<template>
  <lightning-modal-header
      label="Cart"
  ></lightning-modal-header>

  <lightning-modal-body>
      <template lwc:if={hasLines}>
          <div class="table-wrapper">
              <table
                  class="slds-table slds-table_cell-buffer slds-table_bordered"
              >
                  <thead>
                      <tr>
                          <th scope="col">
                              <span title="Item">Item</span>
                          </th>

                          <th scope="col">
                              <span title="Unit Price">
                                  Unit Price
                              </span>
                          </th>

                          <th scope="col">
                              <span title="Quantity">
                                  Quantity
                              </span>
                          </th>

                          <th scope="col">
                              <span title="Line Total">
                                  Line Total
                              </span>
                          </th>

                          <th scope="col">
                              <span class="slds-assistive-text">
                                  Actions
                              </span>
                          </th>
                      </tr>
                  </thead>

                  <tbody>
                      <template
                          for:each={lines}
                          for:item="line"
                      >
                          <tr key={line.itemId}>
                              <td>
                                  <strong>{line.name}</strong>

                                  <div class="available-stock">
                                      Available:
                                      {line.availableQuantity}
                                  </div>
                              </td>

                              <td>
                                  <lightning-formatted-number
                                      value={line.price}
                                      format-style="currency"
                                      currency-code={currencyCode}
                                  ></lightning-formatted-number>
                              </td>

                              <td class="quantity-cell">
                                  <lightning-input
                                      data-quantity-input
                                      data-id={line.itemId}
                                      type="number"
                                      variant="label-hidden"
                                      label="Quantity"
                                      value={line.quantity}
                                      min="1"
                                      max={line.availableQuantity}
                                      step="1"
                                      onchange={handleQuantityChange}
                                  ></lightning-input>
                              </td>

                              <td>
                                  <strong>
                                      <lightning-formatted-number
                                          value={line.lineTotal}
                                          format-style="currency"
                                          currency-code={currencyCode}
                                      ></lightning-formatted-number>
                                  </strong>
                              </td>

                              <td class="action-cell">
                                  <lightning-button-icon
                                      icon-name="utility:delete"
                                      alternative-text="Remove item"
                                      title="Remove item"
                                      variant="bare"
                                      data-id={line.itemId}
                                      onclick={handleRemove}
                                  ></lightning-button-icon>
                              </td>
                          </tr>
                      </template>
                  </tbody>
              </table>
          </div>

          <section class="cart-summary">
              <div>
                  <span>Total Items</span>
                  <strong>{totalItems}</strong>
              </div>

              <div>
                  <span>Grand Total</span>

                  <strong>
                      <lightning-formatted-number
                          value={grandTotal}
                          format-style="currency"
                          currency-code={currencyCode}
                      ></lightning-formatted-number>
                  </strong>
              </div>
          </section>
      </template>

      <template lwc:else>
          <div class="empty-cart">
              <lightning-icon
                  icon-name="utility:cart"
                  alternative-text="Empty cart"
                  size="large"
              ></lightning-icon>

              <p>Your cart is empty.</p>
          </div>
      </template>
  </lightning-modal-body>

  <lightning-modal-footer>
      <lightning-button
          label="Close"
          variant="neutral"
          onclick={handleClose}
      ></lightning-button>

      <lightning-button
          class="checkout-button"
          label="Checkout"
          variant="brand"
          disabled={checkoutDisabled}
          onclick={handleCheckout}
      ></lightning-button>
  </lightning-modal-footer>
</template>
