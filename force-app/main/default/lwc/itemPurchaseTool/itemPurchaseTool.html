<template>
  <lightning-card
      title="Item Purchase Tool"
      icon-name="standard:orders"
  >
      <template lwc:if={isCheckingOut}>
          <lightning-spinner
              alternative-text="Creating purchase"
              size="medium"
          ></lightning-spinner>
      </template>

      <div class="toolbar">
          <div class="toolbar-actions">
              <lightning-button
                  label={cartButtonLabel}
                  icon-name="utility:cart"
                  variant="neutral"
                  disabled={cartButtonDisabled}
                  onclick={handleOpenCart}
              ></lightning-button>

              <template lwc:if={isManager}>
                  <lightning-button
                      label="New Item"
                      icon-name="utility:add"
                      variant="brand"
                      onclick={handleNewItem}
                  ></lightning-button>
              </template>
          </div>
      </div>

      <template lwc:if={hasAccountContext}>
          <section class="account-summary">
              <div class="account-field">
                  <span class="account-label">
                      Account Name
                  </span>
                  <strong>{accountName}</strong>
              </div>

              <div class="account-field">
                  <span class="account-label">
                      Account Number
                  </span>
                  <strong>{accountNumber}</strong>
              </div>

              <div class="account-field">
                  <span class="account-label">
                      Industry
                  </span>
                  <strong>{accountIndustry}</strong>
              </div>
          </section>
      </template>

      <div class="page">
          <section class="catalog">
              <div class="filter-header">
                  <h2 class="section-heading">
                      Catalogue
                  </h2>

                  <span class="item-count">
                      Listed Items: {listedItemCount}
                  </span>
              </div>

              <template lwc:if={hasAccountContext}>
                  <div class="selected-client">
                      <span>Client</span>
                      <strong>{accountName}</strong>
                  </div>
              </template>

              <template lwc:else>
                  <div class="standalone-client">
                      <lightning-record-picker
                          label="Client"
                          placeholder="Search Accounts"
                          object-api-name="Account"
                          onchange={handleAccountChange}
                          required
                      ></lightning-record-picker>
                  </div>
              </template>

              <div class="filters">
                  <lightning-input
                      type="search"
                      label="Search Items"
                      placeholder="For example, Laptop"
                      value={searchTerm}
                      onchange={handleSearchChange}
                  ></lightning-input>

                  <lightning-combobox
                      label="Type"
                      value={selectedType}
                      options={typeOptions}
                      onchange={handleTypeChange}
                  ></lightning-combobox>

                  <lightning-combobox
                      label="Family"
                      value={selectedFamily}
                      options={familyOptions}
                      onchange={handleFamilyChange}
                  ></lightning-combobox>
              </div>

              <div class="catalog-content">
                  <template lwc:if={isLoading}>
                      <lightning-spinner
                          alternative-text="Loading items"
                          size="medium"
                      ></lightning-spinner>
                  </template>

                  <template lwc:elseif={hasItems}>
                      <div class="item-grid">
                          <template
                              for:each={items}
                              for:item="item"
                          >
                              <article
                                  key={item.Id}
                                  class="item-card"
                              >
                                  <template lwc:if={item.Image__c}>
                                      <img
                                          src={item.Image__c}
                                          alt={item.Name}
                                          class="item-image"
                                      />
                                  </template>

                                  <template
                                      lwc:if={item.ImagePhotographer__c}
                                  >
                                      <div class="photo-attribution">
                                          Photo by

                                          <a
                                              href={item.ImagePhotographerUrl__c}
                                              target="_blank"
                                              rel="noopener noreferrer"
                                          >
                                              {item.ImagePhotographer__c}
                                          </a>

                                          on

                                          <a
                                              href={item.ImageSourceUrl__c}
                                              target="_blank"
                                              rel="noopener noreferrer"
                                          >
                                              Unsplash
                                          </a>
                                      </div>
                                  </template>

                                  <div class="item-body">
                                      <h2 class="item-name">
                                          {item.Name}
                                      </h2>

                                      <p class="item-description">
                                          {item.Description__c}
                                      </p>

                                      <div class="item-details">
                                          <span>{item.Type__c}</span>
                                          <span>{item.Family__c}</span>
                                      </div>

                                      <div class="item-stock">
                                          In Stock:
                                          {item.AvailableQuantity__c}
                                      </div>

                                      <div class="item-footer">
                                          <strong class="item-price">
                                              <lightning-formatted-number
                                                  value={item.Price__c}
                                                  format-style="currency"
                                                  currency-code={currencyCode}
                                              ></lightning-formatted-number>
                                          </strong>

                                          <div class="item-actions">
                                              <lightning-button
                                                  label="Details"
                                                  variant="neutral"
                                                  data-id={item.Id}
                                                  onclick={handleViewDetails}
                                              ></lightning-button>

                                              <lightning-button
                                                  label="Add"
                                                  variant="brand"
                                                  data-id={item.Id}
                                                  onclick={handleAddToCart}
                                              ></lightning-button>
                                          </div>
                                      </div>
                                  </div>
                              </article>
                          </template>
                      </div>
                  </template>

                  <template lwc:else>
                      <div class="empty-state">
                          No matching items were found.
                      </div>
                  </template>
              </div>
          </section>
      </div>
  </lightning-card>
</template>
